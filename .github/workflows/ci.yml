name: Bovix CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Build Verification & Unit Tests
    runs-on: ubuntu-latest

    # ── Environment: All CI jobs run against the TEST database ──
    env:
      EXPO_PUBLIC_APP_ENV: test
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: bovix-test.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: bovix-test
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: bovix-test.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TEST_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Type Checker
        run: npx tsc --noEmit

      - name: Run Jest Test Suite
        run: npm test -- --passWithNoTests

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update to Expo
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: npx eas update --auto --non-interactive
